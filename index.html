    <script>
      (() => {
        const clock = document.querySelector('#local-time');
        const year = document.querySelector('#year');
        const timeZone = 'America/Chicago';
        const timeFormatter = new Intl.DateTimeFormat('en-US', {
          timeZone,
          hour: 'numeric',
          minute: '2-digit',
          timeZoneName: 'short'
        });
        const yearFormatter = new Intl.DateTimeFormat('en-US', { timeZone, year: 'numeric' });

        function updateClock() {
          const now = new Date();
          clock.textContent = timeFormatter.format(now);
          clock.dateTime = now.toISOString();
          clock.title = `Current time in Austin, Texas (${timeZone})`;
          year.textContent = yearFormatter.format(now);
          window.setTimeout(updateClock, 60000 - (Date.now() % 60000) + 20);
        }

        updateClock();
      })();
    </script>
